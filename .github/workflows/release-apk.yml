name: Build release APK

# Manual build of the small release APKs (per-ABI + universal), signed with
# the project's own keystore, supplied through repository secrets
# (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
# The outputs are uploaded as run artifacts; publishing to the Releases
# page stays a separate, deliberate step.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::KEYSTORE_BASE64 secret is not set."; exit 1; }
          KS="${RUNNER_TEMP}/music-release-key.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          {
            echo "storeFile=${KS}"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "keyPassword=${KEY_PASSWORD}"
          } > keystore.properties

      - name: Build release APKs
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -Dorg.gradle.jvmargs="-Xmx5g -Dfile.encoding=UTF-8"

      - name: List built APKs
        shell: bash
        run: ls -la app/build/outputs/apk/release/

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: music-release-arm64-v8a
          path: app/build/outputs/apk/release/music-*-release-arm64-v8a.apk
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: music-release-universal
          path: app/build/outputs/apk/release/music-*-release-universal.apk
          if-no-files-found: error
